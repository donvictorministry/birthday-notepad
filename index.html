<!DOCTYPE html>
<html lang="en" data-dv-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1877F2" id="dvThemeMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="REPLACE-WITH-YOUR-FAVICON.ico">
<title>DV Birthday Notepad</title>
<style>
:root{
 --dv-p:#1877F2;--dv-bg:#fff;--dv-text:#111;--dv-muted:#687078;
 --dv-card:#f7f8fa;--dv-border:#ddd;--dv-danger:#d93025;
 --dv-input-bg:#fff;--dv-hover:#eef5ff;--dv-min:19px;
 --dv-font:-apple-system,system-ui,sans-serif;
}
[data-dv-theme="dark"]{
 --dv-p:#4a9eff;--dv-bg:#0f1115;--dv-text:#e8eaed;--dv-muted:#9aa0a6;
 --dv-card:#1a1d23;--dv-border:#2c3038;--dv-danger:#ff6b60;
 --dv-input-bg:#242830;--dv-hover:#1e2229;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:var(--dv-font);background:var(--dv-bg);color:var(--dv-text);overscroll-behavior-y:contain;transition:background .2s,color .2s;font-size:var(--dv-min)}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;font-size:inherit;color:inherit;font-family:inherit}
button{cursor:pointer;border:0;background:transparent}
.dv-icon{width:22px;height:22px;display:inline-flex;fill:currentColor}
.dv-app{min-height:100dvh;display:flex;flex-direction:column}
.dv-header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--dv-p);color:#fff;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:10}
.dv-title{font-size:20px;font-weight:800;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-header-actions{display:flex;gap:4px}
.dv-hbtn{width:44px;height:44px;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dv-hbtn:active{background:#ffffff22}
.dv-main{flex:1;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.dv-tab-panel{display:none}
.dv-tab-panel.active{display:block}
.dv-card{background:var(--dv-card);border:1px solid var(--dv-border);border-radius:16px;padding:16px;margin-bottom:14px}
.dv-card h2{margin:0 0 12px;font-size:20px}
.dv-info-page p{font-size:19px;line-height:1.6;margin:0 0 12px;color:var(--dv-text)}
.dv-hidden{display:none!important}
.dv-field{margin-top:12px}
.dv-field label{display:block;font-weight:700;margin-bottom:6px;font-size:19px}
.dv-input{width:100%;min-height:48px;border:1px solid var(--dv-border);border-radius:12px;padding:10px 12px;background:var(--dv-input-bg);color:var(--dv-text);outline:none;font-size:19px}
.dv-input:focus{border-color:var(--dv-p)}
.dv-btn{width:100%;min-height:48px;border-radius:12px;padding:10px;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
.dv-primary{background:var(--dv-p);color:#fff}
.dv-secondary{background:var(--dv-input-bg);color:var(--dv-p);border:1px solid var(--dv-p)}
.dv-fill-success{background:#1DB954;color:#fff;border:0}
.dv-fill-danger{background:var(--dv-danger);color:#fff;border:0}
.dv-fill-black{background:#111;color:#fff;border:0}
.dv-actions{display:grid;gap:9px;margin-top:14px}
.dv-actions.dv-row{grid-template-columns:1fr 1fr}

/* Bottom nav */
.dv-bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--dv-bg);border-top:1px solid var(--dv-border);padding-bottom:env(safe-area-inset-bottom)}
.dv-navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;color:var(--dv-muted);font-size:14px;font-weight:700}
.dv-navbtn.active{color:var(--dv-p)}
.dv-navbtn .dv-icon{width:24px;height:24px}

/* Full-page menu (left hamburger + note workspace etc) */
.dv-fullmenu{position:fixed;inset:0;z-index:60;background:var(--dv-bg);color:var(--dv-text);display:none;flex-direction:column}
.dv-fullmenu.open{display:flex}
.dv-fullmenu-head{min-height:60px;display:flex;align-items:center;gap:8px;padding:0 8px;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--dv-border);flex:0 0 auto}
.dv-fullmenu-head .dv-side-title{flex:1;text-align:center;font-weight:800;font-size:20px}
.dv-fullmenu-head-accent{background:var(--dv-p);color:#fff}
.dv-fullmenu-head-accent .dv-side-title{color:#fff}
.dv-fullmenu-head-accent .dv-close{color:#fff}
.dv-fullmenu-body{flex:1;overflow:auto;padding:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.dv-close{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dv-close:active{background:var(--dv-hover)}
.dv-side-item{width:100%;min-height:50px;text-align:left;border-radius:11px;padding:11px;margin-bottom:4px;font-weight:700;font-size:19px}
.dv-side-item:active{background:var(--dv-hover);color:var(--dv-p)}

/* Right settings sidebar (slide panel) */
.dv-sidebar{position:fixed;inset:0;z-index:50;visibility:hidden;pointer-events:none}
.dv-sidebar.open{visibility:visible;pointer-events:auto}
.dv-backdrop{position:absolute;inset:0;background:#0008;opacity:0;transition:opacity .2s}
.dv-sidebar.open .dv-backdrop{opacity:1}
.dv-panel{position:absolute;top:0;right:0;width:min(88vw,340px);height:100dvh;background:var(--dv-bg);color:var(--dv-text);transform:translateX(100%);transition:transform .25s;box-shadow:-8px 0 30px #0003;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.dv-sidebar.open .dv-panel{transform:translateX(0)}
.dv-side-head{min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--dv-border)}
.dv-side-title{font-size:20px;font-weight:800}
.dv-side-body{padding:10px;overflow:auto;flex:1}
.dv-settings-section{padding:14px 8px;border-bottom:1px solid var(--dv-border)}
.dv-settings-section h3{margin:0 0 10px;font-size:17px}
.dv-swatches-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dv-swatch{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.dv-swatch.active{border-color:var(--dv-text)}
.dv-side-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:10px}
.dv-switch{position:relative;width:46px;height:26px;border-radius:20px;background:var(--dv-border);flex:0 0 auto}
.dv-switch.on{background:var(--dv-p)}
.dv-switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.dv-switch.on i{left:23px}
.dv-select{width:100%;min-height:44px;border:1px solid var(--dv-border);border-radius:10px;padding:8px 10px;background:var(--dv-input-bg);color:var(--dv-text)}
.dv-todo-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.dv-todo-row input[type=checkbox]{width:20px;height:20px}
.dv-todo-text{flex:1;font-size:17px}
.dv-todo-text.done{text-decoration:line-through;color:var(--dv-muted)}
.dv-todo-del{color:var(--dv-danger);font-weight:800;font-size:20px;width:32px;text-align:center}

/* Note rows (shared list style for Note + Diary) */
.dv-note-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-radius:12px;background:var(--dv-card);border:1px solid var(--dv-border);margin-bottom:8px}
.dv-note-row-main{flex:1;text-align:left;overflow:hidden;background:transparent;min-height:0;padding:0}
.dv-note-row-main strong{display:block;font-size:19px;font-weight:800;color:var(--dv-p);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-note-row-main span{display:block;font-size:14px;color:var(--dv-muted);margin-top:2px}
.dv-note-dots{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dv-note-dots:active{background:var(--dv-hover)}
.dv-search-row{display:flex;align-items:center;gap:10px;background:var(--dv-hover);border-radius:32px;padding:12px 18px;margin-bottom:14px}
.dv-search-row .dv-icon{color:var(--dv-p);flex:0 0 auto}
.dv-search-row input{flex:1;border:0;outline:none;background:transparent;color:var(--dv-text);font-size:19px}
.dv-search-row input::placeholder{color:var(--dv-muted)}

/* FAB + pill menu (shared by Note + Diary, wired by note.js) */
.dv-fab{position:fixed;right:20px;bottom:calc(90px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--dv-p);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #0004;z-index:70;line-height:0}
.dv-fab .dv-icon{transition:transform .2s}
.dv-fab.dv-fab-open .dv-icon{transform:rotate(135deg)}
.dv-fabmenu-overlay{position:fixed;inset:0;z-index:74;display:none;background:transparent}
.dv-fabmenu-overlay.open{display:block}
.dv-fab-pill{position:fixed;right:20px;display:flex;align-items:center;gap:10px;background:var(--dv-hover);color:var(--dv-p);font-weight:800;font-size:17px;padding:14px 22px;border-radius:32px;box-shadow:0 8px 22px #0003;white-space:nowrap}
.dv-fab-pill .dv-icon{width:22px;height:22px;color:var(--dv-p)}
.dv-fab-pill:active{background:#dce9ff}
.dv-fab-pill-near{bottom:calc(160px + env(safe-area-inset-bottom))}
.dv-fab-pill-far{bottom:calc(228px + env(safe-area-inset-bottom))}

/* Note options / action rows */
.dv-actionrow{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:16px 4px;border-bottom:1px solid var(--dv-border);font-size:19px;font-weight:700;color:var(--dv-text)}
.dv-actionrow:last-child{border-bottom:0}
.dv-actionrow:active{background:var(--dv-hover)}
.dv-actionrow .dv-icon{width:24px;height:24px;flex:0 0 auto}
.dv-color-primary{color:var(--dv-p)}
.dv-color-danger{color:var(--dv-danger)}
.dv-color-green{color:#1DB954}
.dv-color-muted{color:var(--dv-muted)}

/* Note workspace toolbar */
.dv-toolbar-scroll{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--dv-border);flex:0 0 auto}
.dv-tool-icn{flex:0 0 auto;min-width:84px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;border-right:1px solid var(--dv-border);background:transparent;color:var(--dv-muted);font-size:15px;font-weight:700}
.dv-tool-icn:last-child{border-right:0}
.dv-tool-icn .dv-icon{width:24px;height:24px;color:var(--dv-text)}
.dv-tool-icn:active{background:var(--dv-hover)}
.dv-save-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#FFC93C;color:#B3261E;font-weight:900;font-size:16px;padding:9px 14px;border-radius:12px}
.dv-save-btn .dv-icon{width:20px;height:20px;color:#B3261E}
.dv-note-textarea{flex:1;border:0;outline:none;resize:none;padding:16px;background:var(--dv-bg);color:var(--dv-text);font-family:var(--dv-font);font-size:28px;line-height:1.5}

/* Modals */
.dv-modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.dv-modal-wrap.open{display:flex}
.dv-modal-backdrop{position:absolute;inset:0;background:#000a}
.dv-modal{position:relative;width:100%;max-width:400px;background:var(--dv-card);color:var(--dv-text);border:1px solid var(--dv-border);border-radius:18px;padding:22px;box-shadow:0 20px 50px #0006}
.dv-modal h3{margin:0 0 10px;font-size:20px;font-weight:800}
.dv-modal p{margin:0 0 18px;font-size:19px;line-height:1.5;color:var(--dv-muted)}
.dv-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dv-modal-actions.single{grid-template-columns:1fr}

/* Toast (centered, app-wide) — replaces every native alert */
.dv-toast-wrap{position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:24px}
.dv-toast{pointer-events:auto;max-width:320px;text-align:center;background:#1a1d23ee;color:#fff;border-radius:14px;padding:14px 18px;font-size:19px;line-height:1.4;font-weight:600;box-shadow:0 12px 30px #0005;opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s}
.dv-toast.show{opacity:1;transform:scale(1)}
.dv-toast.dv-success{background:#16803cee}
.dv-toast.dv-error{background:#c62828ee}

/* Centered spinner — used app-wide, especially every Dictionary search */
.dv-spinner-wrap{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:#0006}
.dv-spinner-wrap.show{display:flex}
.dv-spinner{width:52px;height:52px;border-radius:50%;border:5px solid #ffffff55;border-top-color:#fff;animation:dvSpin .8s linear infinite}
@keyframes dvSpin{to{transform:rotate(360deg)}}

/* Home tab */
.dv-hero{background:var(--dv-p);color:#fff;border-radius:20px;padding:26px 20px;margin-bottom:16px}
.dv-hero h1{margin:0 0 6px;font-size:26px}
.dv-hero p{margin:0;font-size:19px;opacity:.9}
.dv-quick-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.dv-quick-btn{background:var(--dv-card);border:1px solid var(--dv-border);border-radius:14px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:16px}
.dv-quick-btn .dv-icon{width:26px;height:26px;color:var(--dv-p)}
.dv-recent-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:var(--dv-card);border:1px solid var(--dv-border);margin-bottom:8px;width:100%;text-align:left}

/* Dictionary tab */
.dv-dict-word{font-size:26px;font-weight:800;color:var(--dv-p);margin:0}
.dv-dict-phonetic{color:var(--dv-muted);font-size:17px;margin:2px 0 12px}
.dv-dict-pos{font-weight:800;font-size:17px;margin:14px 0 4px;color:var(--dv-text)}
.dv-dict-def{font-size:18px;line-height:1.5;margin:0 0 8px;padding-left:14px;border-left:3px solid var(--dv-border)}
.dv-dict-example{font-size:16px;color:var(--dv-muted);font-style:italic;margin:4px 0 10px 14px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="dv-app">

<header class="dv-header">
 <button class="dv-hbtn" id="dvHamburgerBtn" aria-label="Open menu">
  <svg class="dv-icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="2"/><rect x="3" y="11" width="18" height="2"/><rect x="3" y="16" width="18" height="2"/></svg>
 </button>
 <div class="dv-title">DV Birthday Notepad</div>
 <button class="dv-hbtn" id="dvDotsBtn" aria-label="Open settings">
  <svg class="dv-icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
 </button>
</header>

<div id="dvToastWrap" class="dv-toast-wrap" aria-live="polite"><div id="dvToast" class="dv-toast"></div></div>
<div id="dvSpinnerWrap" class="dv-spinner-wrap"><div class="dv-spinner"></div></div>

<!-- Tabs are populated by home.js / note.js / dictionary.js / planner.js via dvRegisterTab() -->
<main class="dv-main" id="dvTabContainer"></main>

<!-- Bottom nav buttons are populated by the same dvRegisterTab() calls -->
<nav class="dv-bottomnav" id="dvBottomNav"></nav>

<!-- FAB is shared chrome (Note + Diary); its behavior is wired by note.js -->
<button class="dv-fab dv-hidden" id="dvFab" aria-label="New">
 <svg class="dv-icon" id="dvFabIcon" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>
</button>
<div class="dv-fabmenu-overlay" id="dvFabMenuWrap">
 <button class="dv-fab-pill dv-fab-pill-far" id="dvFabTemplates">
  <svg class="dv-icon" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm8 1.5V8h4.5zM8 12h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>
  <span id="dvFabTemplatesLabel">Notepad Template</span>
 </button>
 <button class="dv-fab-pill dv-fab-pill-near" id="dvFabNewNote">
  <svg class="dv-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg>
  <span id="dvFabNewLabel">Notepad</span>
 </button>
</div>

<!-- Left hamburger menu shell — pages are populated by about-app.js, contact.js, etc. via dvRegisterLeftPage() -->
<div class="dv-fullmenu" id="dvLeftMenu" role="dialog" aria-modal="true" aria-label="Menu">
 <div class="dv-fullmenu-head">
  <button class="dv-close dv-hidden" id="dvLeftBackBtn" aria-label="Back">
   <svg class="dv-icon" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8 1.4-1.4L9.8 12l6.6-6.6z"/></svg>
  </button>
  <div class="dv-side-title" id="dvLeftMenuTitle">Menu</div>
  <button class="dv-close" id="dvLeftCloseBtn" aria-label="Close menu">&times;</button>
 </div>
 <div class="dv-fullmenu-body">
  <div id="dvLeftList"></div>
  <div id="dvLeftPagesContainer"></div>
 </div>
</div>

<!-- Right settings sidebar shell — sections are populated by accent-color-selector.js, dark-mode-toggle.js, etc. via dvRegisterSettingsModule() -->
<div class="dv-sidebar" id="dvSettingsSidebar" role="dialog" aria-modal="true" aria-label="Settings">
 <div class="dv-backdrop" id="dvSettingsBackdrop"></div>
 <aside class="dv-panel">
  <div class="dv-side-head">
   <div class="dv-side-title">Settings</div>
   <button class="dv-close" id="dvSettingsCloseBtn" aria-label="Close settings">&times;</button>
  </div>
  <div class="dv-side-body" id="dvSettingsBody"></div>
 </aside>
</div>

<!-- Generic confirm modal, shared by every module — replaces ALL native alert/confirm/prompt -->
<div class="dv-modal-wrap" id="dvModalWrap" role="dialog" aria-modal="true" aria-labelledby="dvModalTitle">
 <div class="dv-modal-backdrop" id="dvModalBackdrop"></div>
 <div class="dv-modal">
  <h3 id="dvModalTitle">Confirm</h3>
  <p id="dvModalMessage"></p>
  <div class="dv-modal-actions" id="dvModalActions">
   <button class="dv-btn dv-fill-black" id="dvModalCancel">Cancel</button>
   <button class="dv-btn dv-primary" id="dvModalOk">OK</button>
  </div>
 </div>
</div>

</div>

<!--
  ==========================================================================
  MODULE FILES — each one is a real, working, standalone file. Paste a
  replacement with the same filename and it takes effect on next reload,
  no other file needs to change. Load order matters only where noted.
  ==========================================================================
-->
<script src="core.js"></script>

<!-- Left sidebar (hamburger) info pages — any order -->
<script src="about-app.js"></script>
<script src="about-developer.js"></script>
<script src="about-us.js"></script>
<script src="how-to-use.js"></script>
<script src="terms-of-use.js"></script>
<script src="proprietary-software.js"></script>
<script src="support-us.js"></script>
<script src="contact.js"></script>

<!-- Right sidebar (three-dot) settings modules — any order -->
<script src="accent-color-selector.js"></script>
<script src="dark-mode-toggle.js"></script>
<script src="font-selector.js"></script>
<script src="font-slider.js"></script>
<script src="to-do.js"></script>
<script src="install-app.js"></script>
<script src="share-app.js"></script>
<script src="export.js"></script>

<!-- Bottom-nav tabs — home.js loads FIRST so "Home" is the leftmost nav button (registration order = display order). note.js and planner.js are fully independent of each other. -->
<script src="home.js"></script>
<script src="note.js"></script>
<script src="planner.js"></script>
<script src="dictionary.js"></script>

<!-- Boot: restore saved theme/accent/font, wire Escape key, register service worker -->
<script>dvBoot();</script>

</body>
</html>
